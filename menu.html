<meta name="apple-mobile-web-app-title" content="菜單翻譯">
<title>旅行菜單翻譯換算</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Fredoka:wght@500;700&display=swap">
<style>
:root{
  --ink:#4A2C3B; --ink-soft:#80606F; --sky:#FFF5EA; --sky-2:#FFE9F0; --sea:#7CCBEE;
  --maple:#FF6F91; --orange:#FF9F5A; --sun:#FFE27A; --leaf:#43C59E; --pink:#FF9DB5; --paper:#FFFFFF;
  --shadow:0 4px 0 var(--ink);
  --tc:"Chiron GoRound TC","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --latin:"Fredoka","Chiron GoRound TC","Noto Sans TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--tc);font-weight:500;color:var(--ink);line-height:1.6;font-size:15px;padding-top:env(safe-area-inset-top,0px);
  background-color:#FFF5EA;
  background-image:linear-gradient(90deg,rgba(255,157,181,.2) 50%,transparent 50%),linear-gradient(rgba(255,157,181,.2) 50%,transparent 50%);
  background-size:40px 40px}
a{color:var(--maple)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
h3{margin:0 0 6px;font-size:17px;font-weight:800}
.fine{font-size:13px;color:var(--ink-soft)}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:4px solid var(--ink);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-soft)}
.app{max-width:560px;margin:0 auto;padding:14px 14px 48px}
.hero2{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.hero2 svg{width:92px;height:92px;flex:none;filter:drop-shadow(0 4px 0 rgba(74,44,59,.25))}
.bubble{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.bubble:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;width:18px;height:18px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble small{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.card,.acc,.note,.rowc,.sumbox,.receipt,.conv{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow)}
.dest{padding:12px 16px;margin:0 0 12px}
.dest label{display:block;font-weight:800;margin:8px 0 4px;font-size:14px}
select,.dest input{font:700 14px var(--tc);color:var(--ink);padding:9px 12px;border:3px solid var(--ink);border-radius:14px;background:#FFF9F2;max-width:100%}
.dest select{width:100%}
.stick{display:inline-block;background:var(--sun);border:2.5px solid var(--ink);border-radius:8px;padding:0 10px;font:800 13px var(--tc);transform:rotate(-2deg);margin-bottom:6px}
.note{padding:10px 14px;margin:12px 0;font-size:14px;background:#FFFDF7}
.note.warnbox{background:#FFE9DA}
.note .actions{margin:8px 0 0}
.acc{margin:0 0 12px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc summary::-webkit-details-marker{display:none}
.acc summary svg{width:22px;height:22px;transition:transform .2s;flex:none}
.acc[open] summary svg{transform:rotate(180deg)}
.acc[open] summary{border-bottom:3px dotted rgba(74,44,59,.35)}
.acc .in{padding:10px 16px 14px}
.steps{margin:6px 0 0;padding-left:1.2em;font-size:14px}.steps li{margin:.3em 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:700 14px var(--tc);text-decoration:none;box-shadow:var(--shadow);cursor:pointer}
.btn:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-main{background:var(--maple);color:#fff;text-shadow:0 1px 0 rgba(74,44,59,.4)}
.btn-book{background:var(--sun)}
.btn-ai{background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(74,44,59,.4)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.cv-row{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cv-row b{color:var(--maple)}
.chip{flex:none;min-height:40px;padding:0 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:var(--shadow);font:800 14px var(--tc);color:var(--ink);cursor:pointer}
.chip.on{background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(74,44,59,.4)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;margin-left:6px;padding:0 8px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);font-size:11.5px;font-weight:800;vertical-align:.1em}
.sect{margin:14px 0 6px;font-size:18px;font-weight:800}
/* rows */
.rowc{padding:8px 10px 8px 14px;margin:0 0 12px;position:relative;overflow:hidden}
.rowc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--leaf)}
.rowc:nth-child(3n+2):before{background:var(--orange)}.rowc:nth-child(3n+3):before{background:var(--sea)}
.rowc.u{border-color:var(--maple)}.rowc.u:before{background:var(--maple)}
.rc1,.rc2{display:flex;gap:6px;align-items:center;margin:0 0 6px}
.rowc input,.rowc select{font:700 14px var(--tc);color:var(--ink);padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#FFF9F2;min-width:0}
.rowc input{flex:1}.rc2 select{flex:none;max-width:5em}
.rc2 input[data-f="p"]{max-width:7em}
.rowc .btn{min-height:38px;padding:0 12px;box-shadow:0 3px 0 var(--ink)}
.cmp{margin:6px 0 2px;font-size:13px;line-height:1.7}
/* receipt + price tag */
.receipt{padding:6px 8px 12px;margin:0 0 6px;border-radius:16px 16px 6px 6px}
.receipt:before{content:"RECEIPT ✦ 台幣明細";display:block;text-align:center;font:700 12px var(--latin);letter-spacing:.18em;color:var(--ink-soft);padding:6px 0 4px;border-bottom:2px dashed rgba(74,44,59,.35);margin-bottom:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:2px dotted rgba(74,44,59,.3);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{background:#FFF1B8}.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-family:var(--latin)}
.sumbox{background:var(--sun);padding:12px 16px 12px 52px;margin:12px 0;font-size:14.5px;position:relative}
.sumbox:before{content:"";position:absolute;left:16px;top:16px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.sumbig{font-size:22px;font-weight:800;margin-bottom:4px;font-family:var(--latin)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.thumb{position:relative;width:76px;height:76px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#FFF9F2}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);font:800 16px/1 var(--tc);cursor:pointer;padding:0}
textarea#ai-paste{width:100%;font:500 13px var(--tc);color:var(--ink);padding:8px 10px;border:2.5px solid var(--ink);border-radius:14px;background:#FFF9F2;margin-top:8px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(74,44,59,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#FFF5EA;border:3px solid var(--ink);border-radius:28px 28px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h h2{margin:0;font-size:21px;font-weight:800}
.ol-say{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 16px;margin:12px 0;font-size:clamp(22px,6vw,28px);line-height:1.4;box-shadow:var(--shadow);color:var(--maple)}
.ol{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;margin:8px 0;font-size:clamp(22px,6.5vw,32px);line-height:1.4}
.ldlg{position:fixed;inset:0;z-index:80;background:rgba(74,44,59,.6);display:none;align-items:center;justify-content:center;padding:18px}
.ldlg.open{display:flex}
.ld-card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;max-width:420px;width:100%}
.ld-url{word-break:break-all;font-size:12px;background:#FFF9F2;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;margin:6px 0 10px}
.ld-card .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ld-a{display:block;margin:8px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== food cute theme additions ===== */
.hero2 svg{width:108px;height:108px;filter:drop-shadow(0 4px 0 rgba(74,44,59,.22))}
.parade{display:flex;justify-content:center;gap:12px;margin:-4px 0 14px}
.parade svg{width:46px;height:46px;filter:drop-shadow(0 3px 0 rgba(74,44,59,.2))}
.parade svg:nth-child(odd){transform:rotate(-8deg)}.parade svg:nth-child(even){transform:rotate(8deg)}
.setbar{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 14px;padding:9px 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:var(--shadow);font:700 14px var(--tc);color:var(--ink);text-align:left;cursor:pointer}
.setbar .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setbar .r{font-family:var(--latin);color:var(--maple);white-space:nowrap}
.setbar svg{width:22px;height:22px;flex:none;color:var(--ink);--hole:#fff}
.setbar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.fab{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--maple);color:#fff;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0;--hole:var(--maple)}
.fab svg{width:30px;height:30px}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.set-sec{margin:0 0 14px;padding:12px 16px}
.top{background:#fff}

</style>
</head>

<script>
/* ================= helpers ================= */

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseNum(v){
  let s=String(v==null?'':v).trim().replace(/\s/g,'');
  if(!s)return NaN;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  const x=parseFloat(s);return isFinite(x)?x:NaN;
}
const num=v=>{const x=parseNum(v);return x>0?x:0;};

async function copyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}
}

function myRates(){const c=CUR();if(!c)return {cash:'',card:'',fee:''};return RATES[c]||(RATES[c]={cash:'',card:'',fee:''});}
function autoRate(code){
  if(!code)return null;
  if(LIVE&&LIVE.rates&&LIVE.rates[code]>0&&String(LIVE.date)>=BUILTIN.date)return {v:LIVE.rates[code],live:true,date:LIVE.date};
  const t=BUILTIN.twdPerUnit[code];if(t>0)return {v:1/t,live:false,date:BUILTIN.date};
  return null;
}
function rateOf(kind){const m=num(myRates()[kind==='card'?'card':'cash']);if(m>0)return m;const a=autoRate(CUR());return a?a.v:0;}
const feePct=()=>num(myRates().fee);
const cardOn=()=>num(myRates().card)>0||feePct()>0;
const extraF=()=>1+num(S.extra)/100;
function twdOf(local,kind){
  const r=rateOf(kind==='card'?'card':'cash');if(!(r>0))return null;
  if(kind==='card'){if(!cardOn())return null;return local/r*(1+feePct()/100);}
  return local/r;
}

  const c=CUR();if(!c)return '請先在上方輸入貨幣代碼（例如 AED、TRY、INR）。';

async function fetchLiveRate(){
  if(window.claude||typeof fetch!=='function')return false;
  try{
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=ctl?setTimeout(()=>ctl.abort(),6000):null;
    const r=await fetch('https://open.er-api.com/v6/latest/TWD',ctl?{signal:ctl.signal}:{});if(t)clearTimeout(t);
    const j=await r.json();
    if(j&&j.result==='success'&&j.rates&&typeof j.rates==='object'){
      const d=j.time_last_update_unix?new Date(j.time_last_update_unix*1000).toISOString().slice(0,10):BUILTIN.date;
      LIVE={date:d,rates:j.rates};store.set('tmx-live',LIVE);return true;
    }
  }catch(e){}

}

    const w0=twdOf(ep*f,'cash');
    line+=fmtL(ep)+' '+c+(w0!==null?'　≈ <b>NT$'+fmtT(w0)+'</b> 每份':'')+'　<span class="badge" style="background:var(--sun)">選好數量才計入</span>';
  }else if(ep>0){
    const w=twdOf(sub*f,'cash');
    line+=fmtL(ep)+' '+c+(q!==1?' × '+q+' ＝ '+fmtL(sub)+' '+c:'');
    if(w!==null){line+='　≈ <b>NT$'+fmtT(w)+'</b>'+(q!==1?'（每件 NT$'+fmtT(twdOf(ep*f,'cash'))+'）':'');

const AI={sample:null,caps:null,ready:false,checked:false,busy:false,ctl:null,photos:[],msg:'',paste:''};
function aiMsg(t){AI.msg=t;const el=$('#ai-status');if(el)el.textContent=t;}
async function aiInit(){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const smp=await window.claude.use('sample');
      if(smp){let caps=null;try{caps=await smp.limits();}catch(e){caps=null;}
        if(caps&&caps.images){AI.sample=smp;AI.caps=caps;AI.ready=true;}}
    }
  }catch(e){}
  AI.checked=true;render();
}
async function aiShrink(f){
  if(f.size<2.5*1024*1024||typeof createImageBitmap!=='function')return f;
  const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
  const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return b||f;
}
async function aiAddFiles(list){
  if(!AI.ready)return;
  const max=(AI.caps&&AI.caps.images&&AI.caps.images.maxCount)||3;
  for(const f of Array.prototype.slice.call(list||[])){
    if(AI.photos.length>=max){toast('一次最多 '+max+' 張');break;}
    let blob=f;try{blob=await aiShrink(f);}catch(e){blob=f;}
    let url='';try{url=URL.createObjectURL(blob);}catch(e){}
    AI.photos.push({blob:blob,url:url});
  }
  aiMsg('');render();
}
function aiDelPhoto(i){const p=AI.photos[i];if(p&&p.url){try{URL.revokeObjectURL(p.url);}catch(e){}}AI.photos.splice(i,1);render();}
function aiClearPhotos(){AI.photos.forEach(p=>{if(p.url){try{URL.revokeObjectURL(p.url);}catch(e){}}});AI.photos=[];}
function aiExtractObjects(text){
  const s=String(text||''),out=[],stack=[];let inStr=false,esc=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'&&stack.length){inStr=true;continue;}
    if(ch==='{'){if(stack.length)stack[stack.length-1].nested=true;stack.push({s:i,nested:false});}
    else if(ch==='}'&&stack.length){
      const o=stack.pop();
      if(!o.nested){try{const v=JSON.parse(s.slice(o.s,i+1));if(v&&typeof v==='object'&&!Array.isArray(v))out.push(v);}catch(e){}}
    }
  }
  return out;
}
function aiApply(items){
  const rows=[];let dup=0;const curs={},langs={};
  const seen={};S.rows.forEach(r=>{if(r.n||r.orig)seen[(r.orig||r.n)+'|'+r.p]=1;});
  (items||[]).slice(0,120).forEach(it=>{
    if(!it||typeof it!=='object')return;
    const pk=(it.price===null||it.price===undefined||it.price==='')?NaN:Number(it.price);
    const has=isFinite(pk)&&pk>0;
    const r=row0();
    r.n=it.zh||'';
    r.orig=it.orig||'';
    r.p=has?String(S.k?Math.round(pk/1000*1000)/1000:Math.round(pk*100)/100):'';
    r.q='0';
    const bits=[];
    if(it.desc)bits.push(String(it.desc));
    if(it.price_printed&&String(it.price_printed).trim())bits.push('原寫：'+it.price_printed);
    r.d=bits.join('｜');r.u=!!it.uncertain||!has;
    if(!(r.n||r.orig))return;
    if(it.currency&&/^[A-Za-z]{3}$/.test(String(it.currency)))curs[String(it.currency).toUpperCase()]=(curs[String(it.currency).toUpperCase()]||0)+1;
    if(it.lang&&LANGS[String(it.lang)])langs[it.lang]=(langs[it.lang]||0)+1;
    const key=(r.orig||r.n)+'|'+r.p;
    if(seen[key]){dup++;return;}
    seen[key]=1;rows.push(r);
  });
  if(rows.length){
    if(S.rows.length===1&&!S.rows[0].n&&!S.rows[0].orig&&!S.rows[0].p)S.rows=[];
    S.rows=S.rows.concat(rows);
  }
  let warn='';
  const cur=CUR();const cl=Object.keys(curs).sort((a,b)=>curs[b]-curs[a]);
  if(cl.length&&cur&&cl[0]!==cur)warn='照片上的貨幣看起來是 '+cl[0]+'，和你選的 '+cur+' 不同，請確認目的地設定。';
  const ll=Object.keys(langs).sort((a,b)=>langs[b]-langs[a]);
  if(ll.length&&S.langAuto&&LANGS[ll[0]]&&S.lang!==ll[0]){S.lang=ll[0];const ls=$('#lang');if(ls)ls.value=S.lang;refreshDestUI();}
  save();
  return {added:rows.length,dup:dup,warn:warn};
}
const AI_ERR={
  rate_limited:'呼叫太頻繁，或你的 Claude 用量已達上限，請稍後再試。',
  session_expired:'登入已過期，請重新登入 claude.ai 後再試。',
  image_rejected:'照片格式或大小不符，請換一張（支援 JPEG、PNG、WebP、GIF）。',
  refused:'Claude 沒有處理這張照片，請換一張只含菜單的照片。',
  empty_completion:'沒有讀到品項，請拍近一點、光線足夠再試。',
  prompt_too_large:'內容太大，請減少照片張數。',
  upstream_error:'連線出了問題，請稍後再手動試一次。'
};
async function aiRun(){
  if(!AI.ready||AI.busy||!AI.photos.length)return;
  AI.busy=true;AI.ctl=new AbortController();render();
  const total=AI.photos.length;let added=0,dups=0,doneAll=true;const notes=[];
  try{
    for(let i=0;i<total;i++){
      const tag='第 '+(i+1)+'/'+total+' 張';
      aiMsg(tag+'：辨識中…約 10–60 秒，第一次會先請你允許使用 Claude。');
      let text='',trunc=false,err=null;
      try{
        const res=await AI.sample(aiPrompt(),{images:[AI.photos[i].blob],signal:AI.ctl.signal,modelTier:'default',onText:u=>{text=u.text;aiMsg(tag+'：已讀到 '+aiExtractObjects(text).length+' 項…');}});
        text=res.text;trunc=!!res.truncated;
      }catch(e){err=e||{};if(err.text)text=err.text;}
      const items=aiExtractObjects(text);
      if(items.length){const r=aiApply(items);added+=r.added;dups+=r.dup;if(r.warn&&notes.indexOf(r.warn)<0)notes.push(r.warn);}
      if(trunc)notes.push(tag+'內容太長被截斷，只讀到前 '+items.length+' 項，請把這張拆成小區塊再拍一次。');
      if(err&&err.code){
        const c=err.code;
        if(c==='cancelled'){notes.push('已停止。');doneAll=false;break;}
        if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].indexOf(c)>=0){AI.ready=false;doneAll=false;break;}
        if(c==='invalid_json'||c==='empty_completion')notes.push(tag+'：'+AI_ERR.empty_completion);
        else notes.push(tag+'：'+(AI_ERR[c]||AI_ERR.upstream_error)+(items.length?'（已保留中途讀到的 '+items.length+' 項）':''));
        if(c==='rate_limited'||c==='session_expired'){doneAll=false;break;}
      }
    }
  }finally{
    AI.busy=false;AI.ctl=null;
    if(added>0&&doneAll)aiClearPhotos();
    const msg=added>0?'已加入 '+added+' 項'+(dups?'（略過 '+dups+' 項重複）':'')+'，標紅的請對照原圖確認價格與品名。':(dups?'讀到的品項都已在表格裡（略過 '+dups+' 項重複）。':'');
    AI.msg=(msg+' '+notes.join(' ')).trim();
    if(added>0)toast('辨識完成：'+added+' 項');
    render();
  }
}

  else if(a==='settings')openSettings();
  else if(a==='closesettings')closeSettings();
  else if(a==='closeorder')closeOrder();
  else if(a==='speakorder')speakOrder();
  else if(a==='chatprompt')doCopy(chatPrompt(),b);
  else if(a==='jsonprompt')doCopy(aiPromptExternal(),b);
  else if(a==='aiimport')aiImport();
  else if(a==='airun')aiRun();
  else if(a==='aistop'){if(AI.ctl)AI.ctl.abort();}
  else if(a==='aidel')aiDelPhoto(+b.dataset.i);
  else if(a==='ratereset'){const m=myRates();m.cash='';m.card='';m.fee='';store.set('tmx-rates',RATES);refreshRateUI();totals();toast('已改用自動匯率');}
  else if(a==='raterefresh'){toast('更新中…');fetchLiveRate().then(ok=>{refreshRateUI();totals();toast(ok?'已更新匯率':'無法連線更新，沿用目前匯率');});}
  else if(a==='copyurl')doCopy(ldUrl,b);
  else if(a==='copylink'){let u='';try{u=String(location.href).split('#')[0];}catch(x){}doCopy(u+hashStr(),b);}
  else if(a==='closeld')$('#ld').classList.remove('open');
  else if(a==='opentop'){try{window.top.location.href=ldUrl;}catch(x){}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){rowInput(t);return;}
  if(t.id==='ai-paste'){AI.paste=t.value;return;}
  if(t.id==='people'){S.people=Math.max(1,parseInt(t.value)||1);save();totals();return;}
  if(t.id==='extra'){S.extra=t.value;save();totals();return;}
  if(t.id==='r-cash'||t.id==='r-card'||t.id==='r-fee'){const m=myRates();m.cash=$('#r-cash').value;m.card=$('#r-card').value;m.fee=$('#r-fee').value;store.set('tmx-rates',RATES);const st=$('#rate-status');if(st)st.innerHTML=rateStatusHTML();totals();return;}
  if(t.id==='cur-code'){S.custom=t.value.toUpperCase().replace(/[^A-Za-z]/g,'').slice(0,3);save();refreshRateUI();refreshDestUI();totals();return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ai-cam'||t.id==='ai-pick'){aiAddFiles(t.files);return;}
  if(t.tagName==='SELECT'&&t.dataset&&t.dataset.f){rowInput(t);return;}
  if(t.id==='dest'){S.place=t.value;const p=place();if(p.lang&&LANGS[p.lang]){S.lang=p.lang;S.langAuto=true;}save();initDest();refreshRateUI();render();return;}
  if(t.id==='lang'){S.lang=t.value;S.langAuto=false;save();refreshDestUI();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSettings();closeOrder();$('#ld').classList.remove('open');}});

/* ================= boot ================= */
const hashUsed=readHash();const firstRun=!hashUsed&&store.get('tmx-state',null)===null;
initDest();refreshRateUI();render();aiInit();
if(firstRun)openSettings();
if(!window.claude){fetchLiveRate().then(ok=>{if(ok){refreshRateUI();totals();}});}

</script>
</body>
</html>
